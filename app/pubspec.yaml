name: opengym
description: "openGym — gym tracker con backend en Cloudflare y coach Claude vía MCP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, storage and networking (lib/data).
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  collection: ^1.19.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.3

  # UI.
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  wakelock_plus: ^1.8.0

  # Other tracks (workout, settings): rest notification, backup import/export.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    # Generated by scripts/build-flutter-cloudflare-data.mjs — do not edit by hand.
    - assets/exercises.json
