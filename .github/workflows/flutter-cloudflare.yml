# The Flutter app (app/) and its Cloudflare Worker backend (cloudflare/). Separate from test.yml,
# which covers the original React app and Node API, so each only runs when its own code changes.
name: Flutter + Cloudflare

on:
  pull_request:
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'docs/flutter-cloudflare/fixtures/**'
      - 'scripts/build-flutter-cloudflare-data.mjs'
      - 'frontend/src/lib/**'
      - 'frontend/src/instr/es.js'
      - 'frontend/src/locales/es.js'
      - 'api/coach/validate.js'
      - '.github/workflows/flutter-cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/**'
      - 'docs/flutter-cloudflare/fixtures/**'
      - 'scripts/build-flutter-cloudflare-data.mjs'
      - 'frontend/src/lib/**'
      - 'frontend/src/instr/es.js'
      - 'frontend/src/locales/es.js'
      - 'api/coach/validate.js'
      - '.github/workflows/flutter-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both engines are pinned to fixtures generated by running the original JS; the catalogues are
  # generated from the React app's dataset. Either drifting silently would split the three apart.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-flutter-cloudflare-data.mjs --check
      - run: node docs/flutter-cloudflare/fixtures/tools/generate.mjs
      - name: Fixtures match the original code
        run: git diff --exit-code -- docs/flutter-cloudflare/fixtures

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the Worker bundles (and stays under the size limit) without deploying anything.
      - run: npx wrangler deploy --dry-run --outdir dist

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
